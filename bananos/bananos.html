<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Los Bananos">
<meta name="theme-color" content="#2d5a1b">
<title>Los Bananos — Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --green-dark:#2d5a1b;--green2:#3d7a25;--gold:#c9a84c;--gold-light:#e8c97a;
  --cream:#f5f2e8;--cream2:#ede8d9;--white:#ffffff;
  --text:#1a2e1a;--text-soft:#5a6a50;
  --red:#c0392b;--green:#1e7e5a;--green-bg:#e8f5ef;--red-bg:#fdf0ee;
  --shadow:0 4px 24px rgba(45,90,27,0.13);--shadow-lg:0 12px 48px rgba(45,90,27,0.18);
  --radius:12px;--sidebar:230px;--bottom-nav:64px;
}
html.dark{
  --green-dark:#4a9a6a;--green2:#5ab07a;--gold:#d4b06a;--gold-light:#e8c97a;
  --cream:#141710;--cream2:#2a3024;--white:#1e2419;
  --text:#e8e4dc;--text-soft:#a8b89a;
  --red:#e08080;--green:#6abf8a;--green-bg:rgba(74,154,106,0.15);--red-bg:rgba(224,128,128,0.15);
  --shadow:0 2px 8px rgba(0,0,0,0.3);--shadow-lg:0 8px 32px rgba(0,0,0,0.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;}
body{font-family:'Figtree',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--cream);color:var(--text);min-height:100vh;font-weight:400;letter-spacing:-0.005em;}

#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--green-dark) 0%,#1a3a0a 100%);}
.login-box{background:var(--white);border-radius:20px;padding:48px 40px;width:360px;box-shadow:var(--shadow-lg);text-align:center;}
.login-logo{font-family:'Fraunces',serif;font-size:1.6rem;color:var(--green-dark);}
.login-sub{font-size:0.8rem;color:var(--text-soft);margin:6px 0 32px;letter-spacing:0.06em;text-transform:uppercase;}
.pin-label{font-size:0.78rem;font-weight:600;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:10px;}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:24px;}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--cream2);transition:all 0.2s;}
.pin-dot.filled{background:var(--green-dark);transform:scale(1.15);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.pin-btn{background:var(--cream);border:none;border-radius:10px;padding:18px;font-family:'DM Sans',sans-serif;font-size:1.2rem;font-weight:600;color:var(--green-dark);cursor:pointer;transition:all 0.15s;}
.pin-btn:hover{background:var(--cream2);}
.pin-btn:active{transform:scale(0.93);background:var(--green-dark);color:white;}
.pin-btn.clear{background:var(--red-bg);color:var(--red);}
.pin-btn.enter{background:var(--green-dark);color:white;}
.login-error{color:var(--red);font-size:0.82rem;min-height:20px;margin-top:4px;}
.login-hint{font-size:0.72rem;color:var(--text-soft);margin-top:16px;line-height:1.7;}

#app{display:none;}
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar);height:100vh;background:var(--green-dark);display:flex;flex-direction:column;z-index:100;box-shadow:4px 0 20px rgba(0,0,0,0.15);}
.sidebar-logo{padding:28px 24px 20px;border-bottom:1px solid rgba(201,168,76,0.2);}
.sidebar-logo h1{font-family:'Fraunces',serif;font-size:1.2rem;color:var(--gold);line-height:1.2;}
.sidebar-logo p{font-size:0.68rem;color:rgba(255,255,255,0.35);margin-top:4px;letter-spacing:0.08em;text-transform:uppercase;}
.user-badge{margin:12px 16px 8px;padding:10px 14px;border-radius:8px;background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.2);display:flex;align-items:center;justify-content:space-between;}
.ub-name{font-size:0.78rem;color:var(--gold);font-weight:600;}
.ub-role{font-size:0.65rem;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.07em;}
.logout-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.3);font-size:1rem;padding:4px;transition:color 0.2s;}
.logout-btn:hover{color:var(--red);}
.nav-section{padding:8px 0;flex:1;overflow-y:auto;}
.nav-label{font-size:0.62rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.3);padding:8px 24px 4px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 24px;cursor:pointer;transition:all 0.2s;color:rgba(255,255,255,0.6);font-size:0.88rem;font-weight:400;border-left:3px solid transparent;}
.nav-item:hover{color:var(--white);background:rgba(255,255,255,0.05);}
.nav-item.active{color:var(--gold);background:rgba(201,168,76,0.1);border-left-color:var(--gold);font-weight:500;}
.nav-item .icon{font-size:1rem;width:18px;text-align:center;}
.sidebar-footer{padding:14px 24px;border-top:1px solid rgba(255,255,255,0.07);font-size:0.7rem;color:rgba(255,255,255,0.2);}
.main{margin-left:var(--sidebar);min-height:100vh;}
.topbar{background:var(--white);padding:16px 36px;border-bottom:1px solid var(--cream2);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.topbar-title{font-family:'Fraunces',serif;font-size:1.35rem;color:var(--green-dark);}
.topbar-date{font-size:0.8rem;color:var(--text-soft);}
.content{padding:32px 36px;}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bottom-nav);background:var(--green-dark);z-index:100;box-shadow:0 -2px 16px rgba(0,0,0,0.2);border-top:1px solid rgba(255,255,255,0.08);}
.bottom-nav-items{display:flex;height:100%;}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:rgba(255,255,255,0.45);transition:color 0.2s;border:none;background:none;padding:0;-webkit-tap-highlight-color:rgba(201,168,76,0.2);touch-action:manipulation;min-height:44px;}
.bn-item.active{color:var(--gold);}
.bn-icon{font-size:1.2rem;}
.bn-label{font-size:0.58rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;}
.mobile-header{display:none;background:var(--green-dark);color:white;padding:14px 20px;position:sticky;top:0;z-index:50;align-items:center;justify-content:space-between;}
.mobile-header-title{font-family:'Fraunces',serif;font-size:1.1rem;color:var(--gold);}
.mobile-user{font-size:0.7rem;color:rgba(255,255,255,0.5);}

.screen{display:none;animation:fadeIn 0.25s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;margin-bottom:24px;}
.card-title{font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--green-dark);margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--cream);display:flex;align-items:center;gap:10px;}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:28px;}
.stat-card{background:var(--white);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);border-top:3px solid var(--gold);transition:transform 0.2s;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.stat-label{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-soft);font-weight:600;}
.stat-value{font-family:'DM Serif Display',serif;font-size:1.9rem;color:var(--green-dark);margin:6px 0 2px;}
.stat-sub{font-size:0.75rem;color:var(--text-soft);}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group.full{grid-column:1/-1;}
label{font-size:0.78rem;font-weight:600;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.06em;}
input,select,textarea{border:1.5px solid var(--cream2);border-radius:8px;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--text);background:var(--white);transition:border-color 0.2s,box-shadow 0.2s;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.12);}
textarea{resize:vertical;min-height:80px;}

.calc-preview{background:var(--green-dark);border-radius:var(--radius);padding:20px 24px;margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.calc-item{text-align:center;}
.calc-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,0.45);}
.calc-value{font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--gold);margin-top:4px;}

.btn{padding:11px 24px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:8px;}
.btn-gold{background:var(--gold);color:var(--green-dark);}
.btn-gold:hover{background:var(--gold-light);}
.btn-outline{background:transparent;border:1.5px solid var(--cream2);color:var(--text-soft);}
.btn-outline:hover{border-color:var(--green-dark);color:var(--green-dark);}
.btn-danger{background:var(--red-bg);color:var(--red);border:1.5px solid #f5c6c2;}
.btn-danger:hover{background:#fbe0dd;}
.btn-sm{padding:6px 14px;font-size:0.78rem;}
.btn-row{display:flex;gap:12px;margin-top:24px;justify-content:flex-end;flex-wrap:wrap;}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:0.85rem;}
thead tr{background:var(--green-dark);}
thead th{color:var(--white);font-weight:600;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.07em;padding:12px 14px;text-align:left;white-space:nowrap;}
/* Columnas sticky tabla reservas */
.res-sticky-1,.res-sticky-2,.res-sticky-3{position:sticky;z-index:2;}
.res-sticky-1{left:0;min-width:36px;background:var(--white);}
.res-sticky-2{left:36px;min-width:64px;background:var(--white);}
.res-sticky-3{left:100px;min-width:140px;border-right:1px solid var(--cream2);background:var(--white);}
tbody tr:hover .res-sticky-1,tbody tr:hover .res-sticky-2,tbody tr:hover .res-sticky-3{background:rgba(45,90,27,0.04);}
thead .res-sticky-1,thead .res-sticky-2,thead .res-sticky-3{background:var(--green-dark);z-index:3;}
/* Modal popup calendario */
.cal-popup{display:none;position:fixed;inset:0;z-index:200;align-items:center;justify-content:center;padding:20px;}
.cal-popup.show{display:flex;}
.cal-popup-backdrop{position:absolute;inset:0;background:rgba(26,74,58,0.5);backdrop-filter:blur(2px);}
.cal-popup-box{position:relative;z-index:1;background:var(--white);border-radius:var(--radius);width:100%;max-width:380px;overflow:hidden;box-shadow:0 20px 60px -10px rgba(0,0,0,0.3);}
.cal-popup-header{padding:16px 20px;display:flex;align-items:center;gap:12px;}
.cal-popup-header strong{font-size:1rem;font-weight:600;color:white;flex:1;}
.cal-popup-body{padding:0 20px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.cal-popup-field{display:flex;flex-direction:column;gap:3px;}
.cal-popup-label{font-size:0.64rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-soft);font-weight:600;}
.cal-popup-value{font-size:0.9rem;font-weight:500;color:var(--green-dark);}
.cal-popup-footer{padding:14px 20px;border-top:1px solid var(--cream2);display:flex;gap:10px;justify-content:flex-end;}
.cal-popup-close{background:none;border:1px solid var(--cream2);border-radius:8px;padding:8px 16px;font-family:inherit;font-size:0.82rem;font-weight:600;color:var(--text-soft);cursor:pointer;}
tbody tr{border-bottom:1px solid var(--cream2);transition:background 0.15s;}
tbody tr:hover{background:rgba(45,90,27,0.04);}
tbody td{padding:11px 14px;color:var(--text);white-space:nowrap;}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.7rem;font-weight:600;}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-gold{background:#fef9ec;color:#8a6d00;}
.badge-red{background:var(--red-bg);color:var(--red);}
.badge-navy{background:rgba(45,90,27,0.08);color:var(--green-dark);}
.badge-purple{background:rgba(160,120,200,0.2);color:#c09ae0;}

.cal-controls{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.cal-controls select{width:auto;}
.cal-scroll{overflow-x:auto;}
.cal-grid{display:grid;gap:2px;font-size:0.72rem;min-width:700px;}
.cal-header{background:var(--green-dark);color:var(--white);padding:8px 4px;text-align:center;font-weight:700;border-radius:4px;}
.cal-depto{color:var(--white);padding:8px 10px;font-weight:700;border-radius:4px;display:flex;align-items:center;font-size:0.75rem;}
.cal-cell{background:var(--cream);min-height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:0.6rem;font-weight:600;text-align:center;padding:2px;}
.cal-cell.occupied{color:white;}
.cal-cell.available{background:#e8f5ef;color:#1e7e5a;}
/* Celdas partidas */
.cal-cell.split{padding:0;overflow:hidden;position:relative;cursor:pointer;}
.cal-cell.split .split-top{position:absolute;top:0;left:0;right:0;bottom:0;clip-path:polygon(0 0,100% 0,0 100%);display:flex;align-items:flex-start;justify-content:flex-start;padding:2px 3px;font-size:0.55rem;font-weight:700;color:white;line-height:1;}
.cal-cell.split .split-bot{position:absolute;top:0;left:0;right:0;bottom:0;clip-path:polygon(100% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:flex-end;padding:2px 3px;font-size:0.55rem;font-weight:700;color:white;line-height:1;}
.cal-cell.split .split-line{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to bottom right,transparent calc(50% - 0.5px),rgba(255,255,255,0.6),transparent calc(50% + 0.5px));pointer-events:none;}
.cal-cell.occupied{position:relative;}
.cal-cell.early-ci::after{content:"▶";position:absolute;top:1px;left:2px;font-size:0.45rem;opacity:0.8;}
.cal-cell.late-co::after{content:"◀";position:absolute;bottom:1px;right:2px;font-size:0.45rem;opacity:0.8;}
/* Checkbox early/late */
.ci-co-group{display:flex;flex-direction:column;gap:5px;}
.ci-co-check{display:flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--text-soft);font-weight:500;cursor:pointer;margin-top:2px;}
.ci-co-check input[type=checkbox]{width:14px;height:14px;cursor:pointer;}

.filter-row{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
.filter-row label{margin:0;}
.totals-box{background:var(--green-dark);border-radius:var(--radius);padding:24px 28px;color:white;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.totals-item .tl{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.07em;color:rgba(255,255,255,0.45);}
.totals-item .tv{font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--gold);margin-top:4px;}
.totals-item.highlight .tv{color:#6ee7b7;font-size:1.8rem;}

.aviso-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
.aviso-header{color:white;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;}
.aviso-body{padding:20px 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.af-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-soft);font-weight:600;}
.af-value{font-size:0.9rem;font-weight:500;color:var(--green-dark);margin-top:3px;}
.aviso-footer{padding:12px 22px;background:var(--cream);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

.pin-settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.pin-user-card{background:var(--cream);border-radius:var(--radius);padding:20px;}
.pin-user-card h4{font-size:0.85rem;font-weight:600;color:var(--green-dark);margin-bottom:4px;}
.pin-user-card p{font-size:0.75rem;color:var(--text-soft);margin-bottom:14px;}
.pin-input-row{display:flex;gap:10px;align-items:center;}
.pin-input-row input{width:120px;letter-spacing:0.2em;font-size:1rem;text-align:center;}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-soft);}
.empty-state .es-icon{font-size:3rem;margin-bottom:16px;opacity:0.4;}
.section-title{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--green-dark);margin-bottom:6px;}
.section-sub{font-size:0.85rem;color:var(--text-soft);margin-bottom:28px;}
/* Dashboard items estilo Catalinas */
.dash-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--cream2);}
.dash-item:last-child{border-bottom:none;}
.dash-item-left{display:flex;align-items:center;gap:8px;min-width:0;}
.dash-item-name{font-weight:500;font-size:0.88rem;color:var(--green-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash-item-meta{font-size:0.82rem;color:var(--text-soft);flex-shrink:0;}
.hoy-cols-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px;}
@media(max-width:860px){.hoy-cols-3{grid-template-columns:1fr;}}
.toast{position:fixed;bottom:30px;right:30px;background:var(--green-dark);color:white;padding:14px 22px;border-radius:var(--radius);font-size:0.88rem;box-shadow:var(--shadow-lg);transform:translateY(80px);opacity:0;transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);z-index:9999;display:flex;align-items:center;gap:10px;border-left:4px solid var(--gold);}
.toast.show{transform:translateY(0);opacity:1;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--cream2);border-radius:3px;}

@media(max-width:768px){
  .sidebar{display:none;}
  .main{margin-left:0;padding-bottom:var(--bottom-nav);}
  .topbar{display:none;}
  .mobile-header{display:flex;}
  .bottom-nav{display:block;}
  .content{padding:16px;}
  .stats-grid{grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .stat-card{padding:16px;}
  .stat-value{font-size:1.4rem;}
  .form-grid{grid-template-columns:1fr;}
  .form-group.full{grid-column:1;}
  .calc-preview{grid-template-columns:1fr 1fr;gap:12px;padding:16px;}
  .card{padding:18px;border-radius:10px;}
  .totals-box{grid-template-columns:1fr 1fr;gap:12px;padding:16px;}
  .totals-item .tv{font-size:1.1rem;}
  .totals-item.highlight .tv{font-size:1.4rem;}
  .aviso-body{grid-template-columns:1fr 1fr;}
  .pin-settings-grid{grid-template-columns:1fr;}
  .btn-row{justify-content:stretch;}
  .btn-row .btn{flex:1;justify-content:center;}
  .login-box{width:calc(100vw - 32px);padding:36px 24px;}
  .toast{bottom:calc(var(--bottom-nav) + 12px);right:16px;left:16px;font-size:0.82rem;}
  .dashboard-grid{grid-template-columns:1fr !important;}
}
@media(max-width:480px){
  .aviso-body{grid-template-columns:1fr;}
  .aviso-footer{flex-direction:column;align-items:flex-start;gap:8px;}
  .wa-btns{width:100%;display:flex;gap:8px;}
  .wa-btns button{flex:1;}
}

html.dark body{background:var(--cream);color:var(--text);}
html.dark .sidebar{background:#0c110a;box-shadow:4px 0 20px rgba(0,0,0,0.4);}
html.dark .nav-item{color:rgba(232,228,220,0.7);}
html.dark .nav-item:hover,html.dark .nav-item.active{color:#e8e4dc;background:rgba(255,255,255,0.08);}
html.dark .nav-label{color:rgba(232,228,220,0.3);}
html.dark .sidebar-logo h1,html.dark .sidebar-logo p{color:#e8e4dc;}
html.dark .user-badge,html.dark .ub-name,html.dark .ub-role{color:#e8e4dc;}
