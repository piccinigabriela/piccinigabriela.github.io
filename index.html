<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CheckInn — Estamos mejorando el sitio</title>
<style>
  :root {
    --verde: #1e4536;
    --verde-claro: #2a5c48;
    --dorado: #c6a43b;
    --crema: #faf8f5;
    --texto-suave: #cddbd3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--verde);
    background-image: radial-gradient(circle at 20% 20%, var(--verde-claro) 0%, var(--verde) 55%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--crema);
    text-align: center;
  }
  .marca {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    margin-bottom: 28px;
  }
  .marca span:first-child {
    font-size: 32px;
    font-weight: 700;
    color: var(--crema);
    letter-spacing: -0.02em;
  }
  .marca span:last-child {
    font-size: 32px;
    font-weight: 700;
    color: var(--dorado);
  }
  .icono {
    font-size: 40px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  p {
    font-size: 15px;
    color: var(--texto-suave);
    max-width: 380px;
    margin: 0 auto;
    line-height: 1.6;
  }
  .contacto {
    margin-top: 32px;
    font-size: 14px;
  }
  .contacto a {
    color: var(--dorado);
    text-decoration: none;
    font-weight: 600;
  }
  .contacto a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div>
    <div class="marca"><span>Check</span><span>Inn</span></div>
    <div class="icono">🛠️</div>
    <h1>Estamos mejorando el sitio</h1>
    <p>Volvemos enseguida con novedades. Mientras tanto, si querés saber más sobre CheckInn o coordinar una demo, escribinos.</p>
    <div class="contacto">
      <a href="https://wa.me/5491140925939" target="_blank" rel="noopener">Escribinos por WhatsApp</a>
    </div>
  </div>
</body>
</html>
