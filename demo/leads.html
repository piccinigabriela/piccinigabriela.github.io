<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CheckInn · Seguimiento de leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#ece0c6;
    --surface:#fcf4e1;
    --surface-2:#f6ecd6;
    --text:#2a1f0e;
    --text-light:#7d6c49;
    --accent:#d2502a;
    --accent-dark:#b53f1d;
    --accent-soft:#f6e0d2;
    --espresso:#241c10;
    --espresso-2:#352a18;
    --border:#e0cfa8;
    --line:#dfc491;
    --shadow:0 4px 18px -10px rgba(120,80,20,.4), 0 1px 2px rgba(120,80,20,.05);
    --shadow-lg:0 22px 48px -20px rgba(90,60,20,.5);
    --fd:'Sora',sans-serif;
    --fb:'Hanken Grotesk',sans-serif;
    --c1:#d2502a; /* Contactado */
    --c2:#dba53c; /* Demo enviada */
    --c3:#8a7d4a; /* Interesado */
    --c4:#5f9463; /* Instalado */
    --c5:#b56a5a; /* Descartado */
  }
  body{font-family:var(--fb);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}

  /* Header */
  .header{background:rgba(236,224,198,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
  .logo{font-family:var(--fd);font-size:1.25rem;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
  .logo .mark{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:800}
  .logo span{color:var(--accent)}
  .logo small{font-family:var(--fb);font-size:.7rem;font-weight:600;color:var(--text-light);margin-left:6px;text-transform:uppercase;letter-spacing:.06em}
  .header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  .search{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:.85rem;font-family:var(--fb);color:var(--text);min-width:180px}
  .search:focus{outline:2px solid var(--accent);outline-offset:1px}
  select.filter{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px 12px;font-size:.85rem;font-family:var(--fb);color:var(--text)}

  .btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:20px;font-weight:700;font-size:.85rem;cursor:pointer;transition:background .15s;font-family:var(--fb)}
  .btn:hover{background:var(--accent-dark)}
  .btn-ghost{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
  .btn-ghost:hover{background:var(--accent-soft)}
  .btn-danger{background:transparent;color:var(--c5);border:1.5px solid var(--c5)}
  .btn-danger:hover{background:#f6dcd6}

  /* Board */
  .board-wrap{padding:22px 22px 60px;overflow-x:auto}
  .board{display:flex;gap:16px;min-width:max-content}
  .column{width:270px;flex-shrink:0;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:0 0 10px;display:flex;flex-direction:column;max-height:calc(100vh - 110px)}
  .column-head{padding:14px 14px 12px;border-top-left-radius:16px;border-top-right-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .column-head-title{font-family:var(--fd);font-weight:700;font-size:.86rem;color:var(--espresso);display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .count{background:rgba(0,0,0,.08);border-radius:20px;padding:2px 9px;font-size:.72rem;font-weight:700;color:var(--text-light)}
  .cards{padding:0 10px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;min-height:60px}
  .cards.dragover{background:rgba(0,0,0,.04);border-radius:10px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow);cursor:grab;transition:transform .12s, box-shadow .12s}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .card.dragging{opacity:.4}
  .card-name{font-family:var(--fd);font-weight:700;font-size:.9rem;margin-bottom:3px;color:var(--espresso)}
  .card-contact{font-size:.78rem;color:var(--text-light);margin-bottom:8px}
  .card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
  .tag{font-size:.66rem;font-weight:700;background:var(--accent-soft);color:var(--accent-dark);padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
  .card-followup{font-size:.72rem;color:var(--text-light);display:flex;align-items:center;gap:5px}
  .card-followup.overdue{color:var(--c5);font-weight:700}
  .card-followup.overdue::before{content:'⚠';font-size:.75rem}

  .empty-col{padding:18px 10px;text-align:center;color:var(--text-light);font-size:.78rem;opacity:.7}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(36,28,16,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
  .overlay.open{display:flex}
  .modal{background:var(--surface);border-radius:20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);padding:26px}
  .modal h2{font-family:var(--fd);font-size:1.2rem;font-weight:800;margin-bottom:18px;color:var(--espresso)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.76rem;font-weight:700;color:var(--text-light);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
  .field input, .field select, .field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.9rem;font-family:var(--fb);color:var(--text)}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .field textarea{resize:vertical;min-height:60px}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;flex-wrap:wrap}
  .modal-actions-right{display:flex;gap:8px}
  .close-x{position:absolute;top:16px;right:18px;background:none;border:none;font-size:1.3rem;color:var(--text-light);cursor:pointer;line-height:1}
  .modal{position:relative}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--espresso);color:#f3e9d6;padding:11px 22px;border-radius:30px;font-size:.85rem;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:300}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:640px){
    .header{padding:12px 16px}
    .board-wrap{padding:16px}
    .column{width:82vw}
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span class="mark">C</span>Check<span>Inn</span><small>Leads</small></div>
  <div class="header-actions">
    <input type="text" class="search" id="searchInput" placeholder="Buscar alojamiento o contacto...">
    <select class="filter" id="filterFuente"><option value="">Todas las fuentes</option></select>
    <button class="btn" id="btnNew">+ Nuevo lead</button>
  </div>
</div>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-x" id="closeModal">✕</button>
    <h2 id="modalTitle">Nuevo lead</h2>
    <form id="leadForm">
      <div class="field">
        <label>Alojamiento *</label>
        <input type="text" id="f_alojamiento" required placeholder="Ej: Cabañas del Bosque">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Contacto</label>
          <input type="text" id="f_contacto" placeholder="Nombre de la persona">
        </div>
        <div class="field">
          <label>WhatsApp / Tel.</label>
          <input type="text" id="f_telefono" placeholder="+54 9 ...">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Tipo</label>
          <select id="f_tipo">
            <option>Cabañas</option>
            <option>Apart-hotel</option>
            <option>B&B</option>
            <option>Hostel</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="field">
          <label>Fuente</label>
          <input type="text" id="f_fuente" placeholder="cabanias.com.ar, Instagram...">
        </div>
      </div>
      <div class="field">
        <label>Estado</label>
        <select id="f_estado">
          <option value="contactado">Contactado</option>
          <option value="demo">Demo enviada</option>
          <option value="interesado">Interesado</option>
          <option value="instalado">Instalado</option>
          <option value="descartado">Descartado</option>
        </select>
      </div>
      <div class="field">
        <label>Próximo seguimiento</label>
        <input type="date" id="f_seguimiento">
      </div>
      <div class="field">
        <label>Notas</label>
        <textarea id="f_notas" placeholder="Detalles de la conversación, objeciones, próximos pasos..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="btnDelete" style="display:none">Eliminar</button>
        <div class="modal-actions-right">
          <button type="button" class="btn btn-ghost" id="btnCancel">Cancelar</button>
          <button type="submit" class="btn">Guardar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var STORAGE_KEY = 'checkinn_leads_v1';
  var STAGES = [
    {id:'contactado', label:'Contactado', color:'var(--c1)'},
    {id:'demo', label:'Demo enviada', color:'var(--c2)'},
    {id:'interesado', label:'Interesado', color:'var(--c3)'},
    {id:'instalado', label:'Instalado', color:'var(--c4)'},
    {id:'descartado', label:'Descartado', color:'var(--c5)'}
  ];

  var board = document.getElementById('board');
  var overlay = document.getElementById('overlay');
  var form = document.getElementById('leadForm');
  var modalTitle = document.getElementById('modalTitle');
  var btnDelete = document.getElementById('btnDelete');
  var toastEl = document.getElementById('toast');
  var searchInput = document.getElementById('searchInput');
  var filterFuente = document.getElementById('filterFuente');
  var editingId = null;
  var dragId = null;

  function loadLeads(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      console.error('Error leyendo leads', e);
      return [];
    }
  }
  function saveLeads(leads){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(leads));
  }
  function uid(){
    return 'l_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  }
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function todayStr(){
    var d = new Date();
    return d.toISOString().slice(0,10);
  }
  function escapeHtml(s){
    if(!s) return '';
    return s.replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function updateFuenteFilter(leads){
    var current = filterFuente.value;
    var fuentes = [];
    leads.forEach(function(l){
      if(l.fuente && fuentes.indexOf(l.fuente) === -1) fuentes.push(l.fuente);
    });
    filterFuente.innerHTML = '<option value="">Todas las fuentes</option>' +
      fuentes.map(function(f){ return '<option value="'+escapeHtml(f)+'">'+escapeHtml(f)+'</option>'; }).join('');
    filterFuente.value = fuentes.indexOf(current) !== -1 ? current : '';
  }

  function render(){
    var leads = loadLeads();
    updateFuenteFilter(leads);
    var q = searchInput.value.trim().toLowerCase();
    var fFuente = filterFuente.value;

    var filtered = leads.filter(function(l){
      var matchesQ = !q || (l.alojamiento||'').toLowerCase().indexOf(q) !== -1 || (l.contacto||'').toLowerCase().indexOf(q) !== -1;
      var matchesFuente = !fFuente || l.fuente === fFuente;
      return matchesQ && matchesFuente;
    });

    board.innerHTML = '';
    STAGES.forEach(function(stage){
      var col = document.createElement('div');
      col.className = 'column';
      col.innerHTML =
        '<div class="column-head" style="background:linear-gradient(180deg, '+stage.color+'22, transparent)">' +
          '<div class="column-head-title"><span class="dot" style="background:'+stage.color+'"></span>' + stage.label + '</div>' +
          '<div class="count" id="count_'+stage.id+'"></div>' +
        '</div>' +
        '<div class="cards" id="cards_'+stage.id+'" data-stage="'+stage.id+'"></div>';
      board.appendChild(col);

      var cardsEl = col.querySelector('.cards');
      var stageLeads = filtered.filter(function(l){ return l.estado === stage.id; });
      col.querySelector('#count_'+stage.id).textContent = stageLeads.length;

      if(stageLeads.length === 0){
        cardsEl.innerHTML = '<div class="empty-col">Sin leads acá</div>';
      } else {
        stageLeads.forEach(function(lead){
          cardsEl.appendChild(buildCard(lead));
        });
      }

      cardsEl.addEventListener('dragover', function(e){
        e.preventDefault();
        cardsEl.classList.add('dragover');
      });
      cardsEl.addEventListener('dragleave', function(){
        cardsEl.classList.remove('dragover');
      });
      cardsEl.addEventListener('drop', function(e){
        e.preventDefault();
        cardsEl.classList.remove('dragover');
        if(!dragId) return;
        var allLeads = loadLeads();
        var idx = allLeads.findIndex(function(l){ return l.id === dragId; });
        if(idx !== -1){
          allLeads[idx].estado = stage.id;
          saveLeads(allLeads);
          render();
        }
      });
    });
  }

  function buildCard(lead){
    var card = document.createElement('div');
    card.className = 'card';
    card.draggable = true;
    card.dataset.id = lead.id;

    var followupHtml = '';
    if(lead.seguimiento){
      var overdue = lead.seguimiento < todayStr() && lead.estado !== 'instalado' && lead.estado !== 'descartado';
      followupHtml = '<div class="card-followup'+(overdue?' overdue':'')+'">Seguimiento: '+formatDate(lead.seguimiento)+'</div>';
    }

    var tags = '';
    if(lead.tipo) tags += '<span class="tag">'+escapeHtml(lead.tipo)+'</span>';
    if(lead.fuente) tags += '<span class="tag">'+escapeHtml(lead.fuente)+'</span>';

    card.innerHTML =
      '<div class="card-name">'+escapeHtml(lead.alojamiento)+'</div>' +
      (lead.contacto || lead.telefono ? '<div class="card-contact">'+escapeHtml(lead.contacto||'')+(lead.contacto && lead.telefono ? ' · ' : '')+escapeHtml(lead.telefono||'')+'</div>' : '') +
      (tags ? '<div class="card-tags">'+tags+'</div>' : '') +
      followupHtml;

    card.addEventListener('click', function(){ openModal(lead.id); });
    card.addEventListener('dragstart', function(){
      dragId = lead.id;
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', function(){
      card.classList.remove('dragging');
      dragId = null;
    });
    return card;
  }

  function formatDate(iso){
    if(!iso) return '';
    var parts = iso.split('-');
    return parts[2]+'/'+parts[1];
  }

  function openModal(id){
    editingId = id || null;
    form.reset();
    if(id){
      var leads = loadLeads();
      var lead = leads.find(function(l){ return l.id === id; });
      if(!lead) return;
      modalTitle.textContent = 'Editar lead';
      document.getElementById('f_alojamiento').value = lead.alojamiento || '';
      document.getElementById('f_contacto').value = lead.contacto || '';
      document.getElementById('f_telefono').value = lead.telefono || '';
      document.getElementById('f_tipo').value = lead.tipo || 'Cabañas';
      document.getElementById('f_fuente').value = lead.fuente || '';
      document.getElementById('f_estado').value = lead.estado || 'contactado';
      document.getElementById('f_seguimiento').value = lead.seguimiento || '';
      document.getElementById('f_notas').value = lead.notas || '';
      btnDelete.style.display = 'inline-block';
    } else {
      modalTitle.textContent = 'Nuevo lead';
      document.getElementById('f_estado').value = 'contactado';
      btnDelete.style.display = 'none';
    }
    overlay.classList.add('open');
    document.getElementById('f_alojamiento').focus();
  }

  function closeModal(){
    overlay.classList.remove('open');
    editingId = null;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var alojamiento = document.getElementById('f_alojamiento').value.trim();
    if(!alojamiento){ return; }

    var data = {
      alojamiento: alojamiento,
      contacto: document.getElementById('f_contacto').value.trim(),
      telefono: document.getElementById('f_telefono').value.trim(),
      tipo: document.getElementById('f_tipo').value,
      fuente: document.getElementById('f_fuente').value.trim(),
      estado: document.getElementById('f_estado').value,
      seguimiento: document.getElementById('f_seguimiento').value,
      notas: document.getElementById('f_notas').value.trim()
    };

    var leads = loadLeads();
    if(editingId){
      var idx = leads.findIndex(function(l){ return l.id === editingId; });
      if(idx !== -1){
        leads[idx] = Object.assign(leads[idx], data);
      }
      showToast('Lead actualizado');
    } else {
      data.id = uid();
      data.creado = todayStr();
      leads.push(data);
      showToast('Lead agregado');
    }
    saveLeads(leads);
    closeModal();
    render();
  });

  btnDelete.addEventListener('click', function(){
    if(!editingId) return;
    if(!confirm('¿Eliminar este lead? No se puede deshacer.')) return;
    var leads = loadLeads().filter(function(l){ return l.id !== editingId; });
    saveLeads(leads);
    showToast('Lead eliminado');
    closeModal();
    render();
  });

  document.getElementById('btnNew').addEventListener('click', function(){ openModal(null); });
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  document.getElementById('closeModal').addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

  searchInput.addEventListener('input', render);
  filterFuente.addEventListener('change', render);

  render();
})();
</script>
</body>
</html>
